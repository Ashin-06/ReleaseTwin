name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check . --select F,E9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check releasetwin/static/app.js
      - run: python -m releasetwin benchmark
